# Blueprint de Render — Insight Analytics CRM (Multi-tenant)
#
# Arquitectura:
#   - 1 backend compartido (Django + django-tenants)
#   - 1 frontend por empresa (Static Site con VITE_TENANT_SLUG distinto)
#   - 1 base de datos Neon (schemas separados por empresa: wolfcg, insight, ...)
#
# URLs:
#   Frontend Wolf:    https://wolf-crm.onrender.com
#   Frontend Insight: https://insight-crm.onrender.com
#   Backend API:      https://insight-analytics-crm-api.onrender.com/api/v1

services:

  # ── Frontend Wolf Consulting Group ───────────────────────────────────────
  - type: web
    runtime: static
    name: wolf-crm
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: "https://insight-analytics-crm-api.onrender.com/api/v1"
      - key: VITE_TENANT_SLUG
        value: "wolfcg"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Frontend Insight Analytics ────────────────────────────────────────────
  - type: web
    runtime: static
    name: insight-crm
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: "https://insight-analytics-crm-api.onrender.com/api/v1"
      - key: VITE_TENANT_SLUG
        value: "insight"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Backend Django + DRF (compartido entre todos los tenants) ─────────────
  - type: web
    runtime: python
    name: insight-analytics-crm-api
    region: ohio
    plan: starter
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate_schemas --shared &&
      python manage.py migrate_schemas &&
      python manage.py init_tenant
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "insight-analytics-crm-api.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://wolf-crm.onrender.com,https://insight-crm.onrender.com"
      - key: INITIAL_ADMIN_EMAIL
        value: "acardozo@iqdata.com.py"
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@wolfcrm.com.py"

