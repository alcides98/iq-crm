# Blueprint de Render — IQ-CRM (Wolf Consulting Group)
# Despliega backend (Web Service) y frontend (Static Site).
#
# La base de datos (Neon) es externa a Render.
# DATABASE_URL se pega a mano en la pantalla de revision del Blueprint
# (sync: false = secreto, nunca se guarda en el repo).
#
# URLs publicas resultantes:
#   Frontend:   https://iq-crm.onrender.com
#   Backend API: https://iq-crm-backend.onrender.com/api/v1
#
# Para agregar alertas automaticas en el futuro, descomentar las
# secciones de Celery Worker y Celery Beat al final de este archivo.

services:

  # ── Frontend React (Static Site — gratis) ────────────────────────────
  - type: web
    runtime: static
    name: iq-crm
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://iq-crm-backend.onrender.com/api/v1"
    routes:
      # SPA fallback: toda ruta que no sea un archivo real → index.html
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Backend Django + DRF ──────────────────────────────────────────────
  - type: web
    runtime: python
    name: iq-crm-backend
    region: ohio          # misma region que Neon (AWS US East 2 — minimiza latencia)
    plan: starter         # $7/mes — siempre encendido, sin cold start
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py create_initial_admin
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.14"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "iq-crm-backend.onrender.com"
      - key: DATABASE_URL
        sync: false       # Pegar la connection string de Neon aqui
      - key: CORS_ALLOWED_ORIGINS
        value: "https://iq-crm.onrender.com"
      - key: INITIAL_ADMIN_EMAIL
        value: "acardozo@iqdata.com.py"
      - key: INITIAL_ADMIN_PASSWORD
        sync: false       # Contrasena del usuario owner inicial
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@wolfcrm.com.py"

