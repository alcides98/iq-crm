# Blueprint de Render — IQ-CRM (Wolf Consulting Group)
# Despliega backend (Web Service), workers Celery y frontend (Static Site).
#
# La base de datos (Neon) NO se declara aca — es externa a Render.
# DATABASE_URL se pega a mano en el paso de revision del Blueprint
# (marcada "sync: false" = campo secreto, nunca se guarda en este repo).
#
# Orden de operacion en Render al hacer "New > Blueprint":
#   1. Render lee este archivo y muestra la pantalla de revision
#   2. Ahi pegar DATABASE_URL (Neon) e INITIAL_ADMIN_PASSWORD
#   3. Confirmar → Render crea los servicios en paralelo
#   4. Una vez que el backend este verde (health check ok), el tenant
#      wolfcg ya esta creado (init_tenant corre en el buildCommand)
#
# Nombres de servicio (determinan las URLs publicas en onrender.com):
#   Backend API: https://iq-crm-backend.onrender.com
#   Frontend:    https://iq-crm.onrender.com
#   Redis:       interno (no tiene URL publica)

services:

  # ── Frontend React (Static Site) ─────────────────────────────────────
  # type: web + runtime: static = Static Site en Render (gratis, sin plan).
  # El campo "plan" NO va en static sites (Render lo rechaza).
  - type: web
    runtime: static
    name: iq-crm
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://iq-crm-backend.onrender.com/api/v1"
    routes:
      # SPA fallback: cualquier ruta que no sea un archivo real va a index.html
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Backend Django + DRF ──────────────────────────────────────────────
  - type: web
    runtime: python
    name: iq-crm-backend
    region: ohio          # misma region que el proyecto Neon (AWS US East 2)
    plan: starter         # $7/mo — siempre encendido, sin cold start
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate_schemas --shared &&
      python manage.py init_tenant
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.14"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "iq-crm-backend.onrender.com"
      - key: DATABASE_URL
        sync: false       # pegar la connection string de Neon (org "Wolf CG", plan Launch)
      - key: CORS_ALLOWED_ORIGINS
        value: "https://iq-crm.onrender.com"
      - key: REDIS_URL
        fromService:
          name: iq-crm-redis
          type: redis
          property: connectionString
      - key: INITIAL_ADMIN_PASSWORD
        sync: false       # contrasena del usuario owner inicial (cambiar despues)
      - key: DEFAULT_FROM_EMAIL
        value: "noreply@wolfcrm.com.py"

  # ── Celery Worker (procesamiento de tareas async) ─────────────────────
  - type: worker
    runtime: python
    name: iq-crm-celery
    region: ohio
    plan: starter         # $7/mo
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker --loglevel=info --concurrency=2"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        fromService:
          name: iq-crm-backend
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: iq-crm-redis
          type: redis
          property: connectionString

  # ── Celery Beat (scheduler de alertas automaticas) ────────────────────
  - type: worker
    runtime: python
    name: iq-crm-beat
    region: ohio
    plan: starter         # $7/mo
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config beat --scheduler django_celery_beat.schedulers:DatabaseScheduler --loglevel=info"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        fromService:
          name: iq-crm-backend
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: iq-crm-redis
          type: redis
          property: connectionString

  # ── Redis (broker de Celery) ──────────────────────────────────────────
  - type: redis
    name: iq-crm-redis
    plan: free
    region: ohio
    ipAllowList: []       # acepta conexiones desde cualquier IP de Render
